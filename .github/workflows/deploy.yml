name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "build_site.sh"
      - "validate_index.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build site
        run: bash build_site.sh _site/main
      - name: Validate index
        run: |
          python3 -m pip install --quiet pyyaml
          python3 validate_index.py _site/main/index.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
